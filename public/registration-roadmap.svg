<path d="M728 206H868L892 262L868 318H728Z" fill="#003d40"/>
<text x="803" y="250" text-anchor="middle" dominant-baseline="middle" fill="#fff8e8" font-size="17">Early Bird</text>
<text x="803" y="274" text-anchor="middle" dominant-baseline="middle" fill="#fff8e8" font-size="17">entry closes</text>
