<text x="212" y="384">First 3 eligible Pacific</text>
<text x="212" y="408">Islander federations to</text>
<text x="212" y="432">register by 1 March 2027.</text>
<text x="212" y="468">Open to all federations</text>
<text x="212" y="492">except Australia and NZ.</text>
<text x="212" y="528"><tspan font-weight="700">AUD 1,000</tspan> to help with</text>
<text x="212" y="552">flight tickets.</text>
<text x="212" y="588">Minimum 5 players per</text>
<text x="212" y="612">federation to be eligible.</text>
