<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title description">
<title id="title">Oceania Youth Chess Championship 2027 Schedule</title>
<desc id="description">Registration opens 1 September 2026. Pacific Islander federation assistance deadline 1 March 2027; overseas federation entry and Australian visa applications 1 April; first 300 players lucky draw 1 May; Early Bird entry closes 1 August; final entry closes 27 September; arrival 28 September; tournament begins 29 September; departure 4 October. First three eligible federations excluding Australia and New Zealand, with at least five players each, receive AUD 1,000 flight assistance.</desc>
<rect width="1600" height="660" fill="#f4f1e9"/>
<g font-family="Arial, Helvetica, sans-serif">
