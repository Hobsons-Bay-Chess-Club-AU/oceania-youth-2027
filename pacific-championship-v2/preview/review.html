<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pacific Championship V2 — responsive review</title><style>body{margin:0;padding:20px;background:#d8dedb;font:14px Arial;color:#0c2d37}header{display:flex;gap:15px;align-items:center;margin-bottom:20px}select,button{font:inherit;padding:10px}main{display:flex;gap:24px;align-items:flex-start}.desktop{width:792px;height:825px;overflow:hidden;background:#f4f1e9}.desktop iframe{width:1440px;height:1500px;transform:scale(.55);transform-origin:0 0}.mobile{width:390px;height:844px;background:#f4f1e9}iframe{border:0;width:100%;height:100%}p{font-weight:bold}body.dark{background:#263b42;color:#fff}@media(max-width:900px){.desktop{display:none}}</style></head><body><header><b>Pacific Championship / V2</b><select id="route" aria-label="Page"><option value="/">Home</option><option value="/schedule/">Schedule</option><option value="/regulations/">Regulations</option><option value="/registration/">Registration</option><option value="/players/">Players</option><option value="/location/">Venue</option><option value="/news/">News</option><option value="/contact-us/">Contact</option><option value="/sponsors/">Sponsors</option><option value="/organizer/">Organisers</option><option value="/dgt-boards/">Broadcasts</option><option value="/news/2026-08-19-the-road-to-oceania-2027-begins/">Article: announcement</option><option value="/news/2026-07-03-planning-update/">Article: planning</option><option value="/news/2026-07-02-welcome-update/">Article: launch</option></select><button id="theme">Light / Dark</button></header><main><section><p>Desktop · 1440px</p><div class="desktop"><iframe title="Desktop preview" src="/"></iframe></div></section><section><p>Mobile · 390px</p><div class="mobile"><iframe title="Mobile preview" src="/"></iframe></div></section></main><script>const frames=[...document.querySelectorAll('iframe')];document.body.classList.toggle('dark'
