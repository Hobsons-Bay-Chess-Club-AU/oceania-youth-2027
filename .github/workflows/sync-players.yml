name: Sync & Deploy Registered Players

on:
  schedule:
    # Run every hour at minute 0
    - cron: "0 * * * *"
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check_changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch and enrich players data
        env:
          TINYHQ_COOKIE: ${{ secrets.TINYHQ_COOKIE }}
        run: npm run fetch:players

      - name: Check for player data changes
        id: check_changes
        run: |
          if git status --porcelain public/players.json | grep -q "public/players.json"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Player registration data changed!"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No player registration changes detected."
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add public/players.json
          git commit -m "chore(players): sync registered player directory [skip ci]"
          git push

      - name: Setup Pages
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Build Next.js site
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GITHUB_PAGES_CUSTOM_DOMAIN: "true"
        run: npx --no-install next build

      - name: Upload Pages artifact
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
